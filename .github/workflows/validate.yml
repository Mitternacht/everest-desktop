name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    container: archlinux:base
    timeout-minutes: 15
    steps:
      - name: Install validation tools on the GitHub runner
        run: pacman -Syu --noconfirm --needed git python lua imagemagick qt6-declarative quickshell shellcheck
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate source formats
        run: |
          python -m compileall -q everest.py config/actions.py tests
          python tests/validate.py
          luac -p config/hyprland.lua
          bash -n install.sh uninstall.sh
          shellcheck install.sh uninstall.sh
          /usr/lib/qt6/bin/qmlformat --normalize config/dock/shell.qml > /dev/null
      - name: Test installation, rollback, recovery and switching
        run: python -m unittest discover -s tests -v
      - name: Record validation tool versions
        run: pacman -Q python lua quickshell qt6-declarative imagemagick
