DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
# The Makefile runs check-dell-smbios-abi on every build, so a kernel whose
# dell-smbios no longer matches the module fails to build here instead of
# loading a module that writes the wrong SMBIOS tokens.
